scenario:
  id: example_engagement
  system: solar_system
  random_seed: 12345
  time_step_s: 1.0
  duration_s: 21600
  snapshot_interval_s: 10
  orbital_phase_strategy: random

factions:
  - id: red
  - id: blue

units:
  - group: red_bc_group
    faction: red
    class: battlecruiser
    count: 5
    position_km:
      x: 125000000
      y: 2000000
      z: 0
    velocity_km_s:
      x: -1200
      y: 0
      z: 0
    orientation:
      forward_vector: [1, 0, 0]
    formation:
      type: line_abreast
      spacing_km: 200
    objective:
      type: transit_to_point
      destination_km: [0, 0, 0]

termination:
  - type: duration_reached
