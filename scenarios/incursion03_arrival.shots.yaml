# Shot list for incursion03: the Majestics drop out of hyperspace at rest at the hyper limit, bring their wedges up and
# run in-system. Format: docs/RENDER.md.
#   python3 -m simulator render output/incursion03 --shots scenarios/incursion03_arrival.shots.yaml
#   (add --shot-only to check the timings without rendering)
film:
  fps: 24
  resolution: [1280, 720]
  ship_scale: 40
  watermark: /u/penkster          # drawn in the lower left corner of the film; leave empty or remove for none

anchors:
  first: {event: hyper_arrival, which: first}            # the first ship of the group to appear
  centre: {event: hyper_arrival, ship: red_majestics-002}

shots:
  # High above the formation and in-system of it (between the arriving ships and the Sun), looking back out at their
  # bows, far off on a long lens so all three arrivals are in frame and the sails look parallel. Angles are measured
  # from the in-system direction (-x): azimuth 0 is dead ahead of the ships. The camera drifts a little and settles
  # while the rings form, the ships come through, the sails fade and the wedges come up.
  - name: arrival
    follow: centre.ship
    camera: {rig: orbit, distance: 110, azimuth: [-34, -22], elevation: [30, 38], relative_to: [-1, 0, 0], ease: out, lens: 135}
    start: first - 2.5
    duration: 10.0
    speed: 1.0

  # From where that shot ended, the camera stays put. The ships accelerate in-system at about 420 g: toward the camera,
  # past it below and to one side, and on toward the Sun. The camera turns to follow the middle ship, and time speeds
  # up (from real time to thirty-four times) as they shrink to points beside the Sun.
  - name: run_in
    follow: centre.ship
    camera: {rig: release, distance: 110, azimuth: -22, elevation: 38, relative_to: [-1, 0, 0], settle: 2, lens: 135}
    start: first + 7.5
    duration: 14.0
    speed: [1, 34]
