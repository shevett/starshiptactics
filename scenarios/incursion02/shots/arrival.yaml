# Shot list for incursion02: the Majestics dropping out of hyperspace as the scenario opens. Format: docs/RENDER.md.
#   python3 -m simulator render incursion02/arrival
film:
  fps: 24
  resolution: [1280, 720]
  ship_scale: 40
  watermark: /u/penkster          # drawn in the lower left corner of the film; leave empty or remove for none
  profiles:                       # --profile preview: small and at half the frame rate, for a quick look
    preview: {fps: 12, resolution: [640, 360]}

anchors:
  first: {event: hyper_arrival, which: first}            # the first ship of the group to appear
  centre: {event: hyper_arrival, ship: red_majestics-002}

shots:
  # High above the formation and in-system of it (between the arriving ships and the Sun), looking back out at them,
  # far off on a long lens so all three arrivals are in frame and the sails look parallel. Angles are measured from
  # the +x axis, the way the ships point on arrival: 180 is directly in-system. The camera drifts a little and settles
  # while the rings form, the ships come through, the sails fade and the wedges come up.
  - name: arrival
    follow: centre.ship
    camera: {rig: orbit, distance: 110, azimuth: [146, 158], elevation: [30, 38], relative_to: [1, 0, 0], ease: out, lens: 135}
    start: first - 2.5
    duration: 10.0
    speed: 1.0

  # From where that shot ended, the camera lets go: over three seconds it comes to rest. The formation, doing 1200 km/s
  # toward the Sun, comes on, passes below and to one side, and runs on in-system. The camera turns to follow the middle
  # ship, time speeds up (from real time to eleven times), and the ships shrink to points beside the Sun.
  - name: run_in
    follow: centre.ship
    camera: {rig: release, distance: 110, azimuth: 158, elevation: 38, relative_to: [1, 0, 0], settle: 3, lens: 135}
    start: first + 7.5
    duration: 14.0
    speed: [1, 11]
