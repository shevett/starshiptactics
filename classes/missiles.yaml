# Reusable missile and direct-fire weapon classes.

missiles:
  standard_nuclear:
    type: missile
    acceleration_g: 12000
    powered_duration_s: 180
    seeker_range_km: null
    post_burn_behavior: ballistic
    warhead:
      type: nuclear
      yield: null
      lethal_radius_km: null
      damage_radius_km: 1        # per design: within 1 km of the target the warhead does damage (not a kill)
      damage_falloff: linear     # damage = max_damage * (1 - range / damage_radius); detonation at closest approach
      max_damage: 0.5            # fraction of integrity removed by a contact hit (integrity *= 1 - damage)

  xray_laser:
    type: missile
    acceleration_g: 12000
    powered_duration_s: 180
    seeker_range_km: null
    post_burn_behavior: ballistic
    warhead:
      type: xray_laser
      beam_count: null
      beam_energy_j: null
      beam_divergence_rad: null
      max_effective_range_km: null

energy_weapons:
  capital_graser:
    type: graser
    propagation_speed: c
    beam_energy_j: null
    firing_interval_s: null
    aperture_m: null
    beam_divergence_rad: null
    max_effective_range_km: null
    damage_falloff_model: inverse_area
