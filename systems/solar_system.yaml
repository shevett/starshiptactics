# Solar System static environment definition
# Epoch-independent: scenarios choose or randomize orbital phase / true anomaly.
# Units:
#   mass_kg: kilograms
#   radius_km: mean radius in kilometers
#   mu_km3_s2: standard gravitational parameter, km^3/s^2
#   semi_major_axis_km: orbital semi-major axis, kilometers
#   orbital_period_days: sidereal orbital period, Earth days
#
# This is intentionally a major-body simulation set, not a catalog of every
# known minor planet or moon. Additional bodies can be added using the same schema.

system:
  id: solar_system
  name: Solar System
  coordinate_frame: heliocentric_ecliptic_J2000
  position_policy: scenario_defined_or_randomized_phase
  gravity_model:
    type: n_body
    include_all_defined_bodies: true
    softening_km: 0.0

# Optional fictional FTL boundary around the star (SPEC section 21). One of:
#   radius_km: <km>    light_minutes: <light-minutes>    rule: spectral_class_linear
# spectral_class_linear follows David Weber's Honorverse table: G0 = 22.00 light-minutes, minus 0.44 per
# sub-class step toward cooler stars (Sol, G2V -> 21.12; K0 -> 17.60; M0 -> 13.20; M9 -> 9.24). The star's
# spectral_class is read from the body below. Defined for classes F, G, K and M.
hyper_limit:
  rule: spectral_class_linear
  baseline_class: G0
  baseline_light_minutes: 22.0
  step_light_minutes: 0.44

bodies:
